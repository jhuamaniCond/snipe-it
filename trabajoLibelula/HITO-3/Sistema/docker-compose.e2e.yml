# =============================================================================
# Entorno E2E (Laravel Dusk) 100% en Docker. NO usa puertos del host:
# el navegador (Selenium/Chrome), la app y Dusk se comunican por la red interna.
# Resuelve el bloqueo de "Failed to listen on 127.0.0.1:8000" (puertos reservados
# por Docker/Hyper-V en Windows sin admin).
#
# Servicios:
#   db-e2e    -> MariaDB efímera (BD de prueba snipeit_e2e, en tmpfs)
#   selenium  -> Chrome + WebDriver (headless) en el puerto 4444 (interno)
#   app-e2e   -> la app Snipe-IT servida en http://app-e2e (interno, puerto 80)
#   dusk      -> corre `php artisan dusk` contra Chrome remoto y la app
#
# Uso (desde la RAÍZ del repo, con Docker Desktop abierto):
#   docker compose -f trabajoLibelula/HITO-3/Sistema/docker-compose.e2e.yml up --build --abort-on-container-exit dusk
#   docker compose -f trabajoLibelula/HITO-3/Sistema/docker-compose.e2e.yml down -v
# =============================================================================
services:
  db-e2e:
    image: mariadb:11.4.7
    environment:
      MYSQL_DATABASE: snipeit_e2e
      MYSQL_USER: snipeit
      MYSQL_PASSWORD: changeme1234
      MYSQL_ROOT_PASSWORD: changeme1234
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 2s
      retries: 20

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb

  app-e2e:
    build:
      context: ../Integracion
      dockerfile: Dockerfile.test
    working_dir: /app
    depends_on:
      db-e2e:
        condition: service_healthy
    environment: &e2e_env
      APP_ENV: dusk.local
      APP_DEBUG: "true"
      APP_KEY: base64:3ilviXqB9u6DX1NRcyWGJ+sjySF+H18CPDGb3+IVwMQ=
      APP_URL: http://app-e2e
      DB_CONNECTION: mysql
      DB_HOST: db-e2e
      DB_PORT: "3306"
      DB_DATABASE: snipeit_e2e
      DB_USERNAME: snipeit
      DB_PASSWORD: changeme1234
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_DRIVER: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: "4"
      # Servidor multi-worker: evita ERR_CONNECTION_REFUSED al cargar CSS/JS en paralelo
      # (el bind-mount de Windows hace lentas las peticiones y serve es mono-hilo por defecto).
      PHP_CLI_SERVER_WORKERS: "12"
    volumes:
      - ../../../:/app
    # La app se sirve en la red interna (puerto 80); no se publica al host.
    command: bash -lc "php artisan config:clear >/dev/null 2>&1; php artisan serve --host=0.0.0.0 --port=80"

  dusk:
    build:
      context: ../Integracion
      dockerfile: Dockerfile.test
    working_dir: /app
    depends_on:
      db-e2e:
        condition: service_healthy
      selenium:
        condition: service_started
      app-e2e:
        condition: service_started
    environment:
      <<: *e2e_env
      # Chrome remoto (Selenium) — el DuskTestCase generado ya lee DUSK_DRIVER_URL.
      DUSK_DRIVER_URL: http://selenium:4444/wd/hub
      # Evita que Dusk intente arrancar un ChromeDriver local (usa el remoto).
      LARAVEL_SAIL: "1"
    volumes:
      - ../../../:/app
    # Migra el esquema, siembra una fila de settings (requerida por la app/factories)
    # y ejecuta los E2E. Los tests preservan 'settings' del truncado (ver $exceptTables).
    command: bash -lc "php artisan migrate --force && php artisan tinker --execute='App\\Models\\Setting::factory()->create();' && sleep 3 && php artisan dusk --without-tty"
